services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cropchain
      MYSQL_USER: cropchain_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-local-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-only-change-before-deploy}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,backend
      DB_ENGINE: mysql
      DB_NAME: cropchain
      DB_USER: cropchain_user
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      DB_HOST: db
      DB_PORT: 3306
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app:ro
    command: python -m http.server 8080 --bind 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  mysql_data:
