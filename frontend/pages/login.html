<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In – CropChain</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="auth">
    <div class="card">
      <a href="../index.html" class="logo" style="font-weight: 700; font-size: 24px; color: var(--forest); display: block;">CropChain</a>
      <h1 style="font-size: 28px; margin: 16px 0 4px;">Sign in</h1>
      <p style="color: var(--mute); margin: 0 0 24px;">Access your authorized supply chain dashboard.</p>

      <form id="loginForm">
        <div>
          <label for="email">Email Address</label>
          <input 
            id="email" 
            name="email" 
            type="email" 
            placeholder="e.g. farmer@example.com" 
            required 
            autocomplete="username"
          >
        </div>

        <div>
          <label for="password">Password</label>
          <input 
            id="password" 
            name="password" 
            type="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 24px;">Sign In</button>
        <div id="err" class="err hidden" role="alert"></div>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--mute);">
        <span>Looking to verify a product? </span>
        <a href="track.html" style="color: var(--green); font-weight: 600;">Track Batch &rarr;</a>
      </div>
    </div>
  </div>

  <script type="module" src="../assets/js/login.js"></script>
</body>
</html>
