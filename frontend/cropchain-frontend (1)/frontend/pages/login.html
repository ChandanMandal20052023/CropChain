<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/styles.css"><title>Login – CropChain</title></head><body><div class="auth"><div class="card"><a href="../index.html" class="logo" style="font-weight:700;font-size:22px;color:var(--forest)">CropChain</a>
<h1 style="font-size:28px;margin:12px 0 4px">Sign in</h1><p style="color:var(--mute);margin:0">Access your role dashboard.</p>
<form id="loginForm"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username">
<label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
<button class="btn btn-primary" style="width:100%;margin-top:20px">Sign in</button><div id="err" class="err hidden" role="alert"></div></form></div></div>
<script type="module" src="../assets/js/login.js"></script></body></html>
