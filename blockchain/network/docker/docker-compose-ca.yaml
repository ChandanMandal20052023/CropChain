# AgroVaani Fabric CAs for 8 Organizations + Orderer CA
version: '3.8'

networks:
  agrovaani_net:
    name: agrovaani_net

services:
  ca_orderer:
    image: hyperledger/fabric-ca:1.5.12
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../crypto-config/ordererOrganizations/orderer.agrovaani.com/ca/:/etc/hyperledger/fabric-ca-server
    container_name: ca_orderer
    networks:
      - agrovaani_net

  ca_farmer:
