      Writers:
        Type: Signature
        Rule: "OR('AgroVaaniInspectorMSP.admin', 'AgroVaaniInspectorMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('AgroVaaniInspectorMSP.admin')"
