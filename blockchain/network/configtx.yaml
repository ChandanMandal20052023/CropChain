      Writers:
        Type: Signature
        Rule: "OR('AgroVaaniConsumerMSP.admin', 'AgroVaaniConsumerMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('AgroVaaniConsumerMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('AgroVaaniConsumerMSP.peer')"
    AnchorPeers:
      - Host: peer0.consumer.agrovaani.com
        Port: 14051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.agrovaani.com:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.agrovaani.com
        Port: 7050
        ClientTLSCert: ./crypto-config/ordererOrganizations/orderer.agrovaani.com/orderers/orderer.agrovaani.com/tls/server.crt
        ServerTLSCert: ./crypto-config/ordererOrganizations/orderer.agrovaani.com/orderers/orderer.agrovaani.com/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 100
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  AgroVaaniChannelProfile:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *FarmerOrg
        - *CollectionCenterOrg
        - *TransporterOrg
        - *WarehouseOrg
        - *ManufacturerOrg
        - *InspectorOrg
        - *RetailerOrg
        - *ConsumerOrg
      Capabilities: *ApplicationCapabilities
