        Type: Signature
        Rule: "OR('AgroVaaniCollectionCenterMSP.admin', 'AgroVaaniCollectionCenterMSP.peer', 'AgroVaaniCollectionCenterMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('AgroVaaniCollectionCenterMSP.admin', 'AgroVaaniCollectionCenterMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('AgroVaaniCollectionCenterMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('AgroVaaniCollectionCenterMSP.peer')"
    AnchorPeers:
