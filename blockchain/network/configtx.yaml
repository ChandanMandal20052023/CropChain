# AgroVaani Hyperledger Fabric Network - Channel & Consensus Configuration (configtx.yaml)
# Channel: agrovaani-channel
# Ordering: Raft Consensus

---
Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: ./crypto-config/ordererOrganizations/orderer.agrovaani.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer.agrovaani.com:7050

  - &FarmerOrg
    Name: FarmerOrg
    ID: AgroVaaniFarmerMSP
    MSPDir: ./crypto-config/peerOrganizations/farmer.agrovaani.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('AgroVaaniFarmerMSP.admin', 'AgroVaaniFarmerMSP.peer', 'AgroVaaniFarmerMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('AgroVaaniFarmerMSP.admin', 'AgroVaaniFarmerMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('AgroVaaniFarmerMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('AgroVaaniFarmerMSP.peer')"
    AnchorPeers:
      - Host: peer0.farmer.agrovaani.com
        Port: 7051

  - &CollectionCenterOrg
    Name: CollectionCenterOrg
    ID: AgroVaaniCollectionCenterMSP
    MSPDir: ./crypto-config/peerOrganizations/collectioncenter.agrovaani.com/msp
    Policies:
