    Policies:
      Readers:
        Type: Signature
        Rule: "OR('AgroVaaniRetailerMSP.admin', 'AgroVaaniRetailerMSP.peer', 'AgroVaaniRetailerMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('AgroVaaniRetailerMSP.admin', 'AgroVaaniRetailerMSP.client')"
