      Writers:
        Type: Signature
        Rule: "OR('AgroVaaniTransporterMSP.admin', 'AgroVaaniTransporterMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('AgroVaaniTransporterMSP.admin')"
      Endorsement:
        Type: Signature
