    Policies:
      Readers:
        Type: Signature
        Rule: "OR('AgroVaaniWarehouseMSP.admin', 'AgroVaaniWarehouseMSP.peer', 'AgroVaaniWarehouseMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('AgroVaaniWarehouseMSP.admin', 'AgroVaaniWarehouseMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('AgroVaaniWarehouseMSP.admin')"
      Endorsement:
        Type: Signature
