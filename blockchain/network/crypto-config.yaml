# AgroVaani Hyperledger Fabric Network - Cryptographic Identity Configuration
# 8 Supply-Chain Organizations + Raft Ordering Service

OrdererOrgs:
  - Name: Orderer
    Domain: orderer.agrovaani.com
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer.agrovaani.com
        SANS:
          - "localhost"
          - "127.0.0.1"

